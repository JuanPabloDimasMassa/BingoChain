<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 BingoChain - Panel de Administrador</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh; 
            color: white; 
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            position: relative;
            z-index: 1;
        }
        
        .header { 
            text-align: center; 
            margin-bottom: 40px; 
            animation: fadeInDown 1s ease-out;
        }
        
        .header h1 { 
            font-size: clamp(2.5em, 5vw, 3.5em); 
            margin-bottom: 10px; 
            background: linear-gradient(45deg, #FFD700, #FFA500, #FF6B6B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: 2px;
        }
        
        .header p { 
            font-size: 1.1em; 
            opacity: 0.9; 
            font-weight: 300;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(-5px);
        }
        
        .admin-form {
            background: rgba(255,255,255,0.1); 
            backdrop-filter: blur(20px); 
            padding: 40px; 
            border-radius: 25px; 
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: fadeInUp 1s ease-out 0.3s both;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 1em;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1em;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }
        
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4CAF50;
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        .admin-token-section {
            background: rgba(255,193,7,0.1);
            border: 1px solid rgba(255,193,7,0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
        }
        
        .admin-token-section label {
            font-weight: 600;
            color: #FFC107;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submit-btn:disabled {
            background: rgba(255,255,255,0.2);
            cursor: not-allowed;
            transform: none;
        }
        
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            animation: slideIn 0.5s ease-out;
        }
        
        .alert-success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            color: #4CAF50;
        }
        
        .alert-error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.5);
            color: #f44336;
        }
        
        .alert-info {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid rgba(33, 150, 243, 0.5);
            color: #2196F3;
        }
        
        .help-text {
            font-size: 0.85em;
            opacity: 0.7;
            margin-top: 5px;
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="main.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Volver al inicio
        </a>
        
        <div class="header">
            <h1>🔐 Panel de Administrador</h1>
            <p>Crear nuevo sorteo</p>
        </div>
        
        <div id="alert-container"></div>
        
        <div class="admin-form">
            <div class="admin-token-section">
                <label for="adminToken">Token de Administrador *</label>
                <input 
                    type="password" 
                    id="adminToken" 
                    placeholder="Ingresa el token de administrador"
                    required
                >
                <div class="help-text">Token requerido para crear sorteos</div>
            </div>
            
            <form id="lotteryForm">
                <div class="form-group">
                    <label for="lotteryName">Nombre del Sorteo *</label>
                    <input 
                        type="text" 
                        id="lotteryName" 
                        placeholder="Ej: Sorteo Semanal #1"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="contractAddress">Dirección del Contrato *</label>
                    <input 
                        type="text" 
                        id="contractAddress" 
                        placeholder="0x..."
                        required
                    >
                    <div class="help-text">Dirección del contrato inteligente en la blockchain</div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="ticketPrice">Precio del Boleto (ETH) *</label>
                        <input 
                            type="number" 
                            id="ticketPrice" 
                            step="0.00000001"
                            min="0.00000001"
                            placeholder="0.01"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="salesDuration">Duración de Venta (horas)</label>
                        <input 
                            type="number" 
                            id="salesDuration" 
                            min="1"
                            value="23.5"
                            placeholder="23.5"
                        >
                        <div class="help-text">Por defecto: 23.5 horas</div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="salesStartTime">Fecha y Hora de Inicio *</label>
                        <input 
                            type="datetime-local" 
                            id="salesStartTime" 
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="salesEndTime">Fecha y Hora de Fin *</label>
                        <input 
                            type="datetime-local" 
                            id="salesEndTime" 
                            required
                        >
                    </div>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="submitText">Crear Sorteo</span>
                    <span id="submitLoading" class="loading" style="display: none;"></span>
                </button>
            </form>
        </div>
    </div>
    
    <script src="static/js/admin.js"></script>
</body>
</html>
